services:
  app:
    build: .
    image: sweet-cake-studio:latest
    container_name: ${COMPOSE_PROJECT_NAME}-app
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
    volumes:
      - cake_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/bootstrap',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cake_data:
